name: Bug Report
description: Report a bug in the Quil compiler or runtime
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Before submitting:
        - Search [existing issues](https://github.com/quil-project/quil/issues) to avoid duplicates.
        - Make sure you are on the latest release or the `development` branch.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong? Be clear and concise.
      placeholder: |
        e.g. `while` loops with a semicolon-less body produce wrong output.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide a minimal `.quil`/`.qil` file and the exact commands you ran.
      placeholder: |
        ```quil
        int i = 0
        while (i < 3) {
                print(i, "\n")
                i = i + 1
        }
        ```

        ./bin/quil repro.quil
        # (also works with .qil: ./bin/quil repro.qil)
        ./a.out
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include error messages or output.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Quil Version
      description: Output of `cat VERSION` or `./bin/quil --version` if available.
      placeholder: "1.0.0-beta"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux
        - macOS
        - WSL (Windows Subsystem for Linux)
        - Other
    validations:
      required: true

  - type: input
    id: compiler
    attributes:
      label: C Compiler
      description: The compiler used to build/transpile (e.g. `gcc`, `clang`, `tcc`).
      placeholder: "gcc 13.2.0"

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other relevant info — build logs, valgrind output, config, etc.
