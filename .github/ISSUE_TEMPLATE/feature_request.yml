name: Feature Request
description: Suggest a new feature or improvement for quil
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a feature! Before submitting:
        - Search [existing issues](https://github.com/quil-project/quil/issues) and the [README](https://github.com/quil-project/quil) to see if it's already planned.
        - Check the "Development Status" section in the README for work in progress.

  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: What is the problem this feature solves, or what are you trying to do?
      placeholder: |
        e.g. There is no `for` loop, so loops that need an index require manually managing a counter.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the feature and how it should behave. Include syntax examples if applicable.
      placeholder: |
        ```quil
        for (int i = 0; i < 10; i = i + 1) {
                print(i, "\n")
        }
        ```
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative designs or workarounds you've considered.

  - type: textarea
    id: usecases
    attributes:
      label: Example Use Cases
      description: How would this feature be used? Who benefits?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Anything else — links, references, mockups, etc.
